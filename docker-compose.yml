services:
  projet1_postgres:
    image: postgres:15
    container_name: projet1_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"       # port 5433 côté hôte pour ne pas avoir de conflit avec Jaffle qui est sur 5432
    volumes:
      - projet1_data:/var/lib/postgresql/data

volumes:
  projet1_data: